<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>상품 수정 - HanSung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
    .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
    .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .page-header { border-left: 4px solid #e94560; padding-left: 1rem; }
    .btn-update { background: #0f3460; border-color: #0f3460; }
    .btn-update:hover { background: #1a1a2e; border-color: #1a1a2e; }
    .form-control:focus { border-color: #0f3460; box-shadow: 0 0 0 0.2rem rgba(15,52,96,.2); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">HanSung</a>
  </div>
</nav>

<div class="container">
  <div class="page-header mb-4">
    <h4 class="fw-bold mb-0">상품 수정</h4>
    <small class="text-muted">상품 정보를 수정합니다.</small>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card form-card">
        <div class="card-body p-5">
          <form th:action="@{/products/{id}/edit(id=${productId})}" th:object="${productDto}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">상품명</label>
              <input type="text" th:field="*{name}" class="form-control form-control-lg" required/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">가격 (원)</label>
              <input type="number" th:field="*{price}" class="form-control form-control-lg" required/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">재고 수량</label>
              <input type="number" th:field="*{stock}" class="form-control form-control-lg" required/>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">상품 설명</label>
              <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-update text-white btn-lg flex-grow-1 fw-semibold">수정 완료</button>
              <a th:href="@{/products}" class="btn btn-outline-secondary btn-lg px-4">취소</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="text-center py-3 bg-dark" style="position:fixed; bottom:0; width:100%; height: 50px;">
  <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (E) a hh:mm:ss') + '  │  학번: 2271233  │  성명: 임리빈'}"
     style="color: rgba(255,255,255,0.75); font-size: 0.85rem; margin:0;"></p>
</footer>
<div style="height: 60px;"></div>
</body>
</html>
