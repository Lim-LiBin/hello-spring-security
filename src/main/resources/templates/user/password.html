<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 변경 - HanSung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }
    .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .brand-logo { font-size: 2rem; font-weight: 800; color: #e94560; letter-spacing: -1px; }
    .btn-primary { background: #e94560; border-color: #e94560; }
    .btn-primary:hover { background: #c73652; border-color: #c73652; }
    .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 0.2rem rgba(233,69,96,.25); }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <div class="brand-logo">HanSung</div>
            <p class="text-muted mt-1 mb-0">비밀번호 변경</p>
          </div>

          <div th:if="${successMessage}" class="alert alert-success py-2 text-center" th:text="${successMessage}"></div>

          <form th:action="@{/user/password}" th:object="${passwordChangeDto}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">현재 비밀번호</label>
              <input type="password" th:field="*{currentPassword}" class="form-control" required/>
              <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">새 비밀번호</label>
              <input type="password" th:field="*{newPassword}" class="form-control" required/>
              <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">새 비밀번호 확인</label>
              <input type="password" th:field="*{confirmPassword}" class="form-control" required/>
              <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">변경 완료</button>
          </form>

          <div class="text-center mt-3">
            <a th:href="@{/home}" class="text-decoration-none text-muted">홈으로 돌아가기</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="text-center py-3 bg-dark" style="position:fixed; bottom:0; width:100%; height: 50px;">
  <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (E) a hh:mm:ss') + '  │  학번: 2271233  │  성명: 임리빈'}"
     style="color: rgba(255,255,255,0.75); font-size: 0.85rem; margin:0;"></p>
</footer>
<div style="height: 60px;"></div>
</body>
</html>
